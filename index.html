<!DOCTYPE html>
<html lang="ja" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>リアルタイム音声翻訳アプリ</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0f7ff',
                            100: '#e0effe',
                            500: '#3b82f6',
                            600: '#2563eb',
                            700: '#1d4ed8',
                            900: '#1e3a8a',
                        }
                    },
                    animation: {
                        'pulse-fast': 'pulse 1s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'wave': 'wave 1.2s ease-in-out infinite'
                    },
                    keyframes: {
                        wave: {
                            '0%, 100%': { height: '8px' },
                            '50%': { height: '32px' }
                        }
                    }
                }
            }
        }
    </script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(30, 41, 59, 0.5);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(100, 116, 139, 0.5);
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(148, 163, 184, 0.8);
        }
        .glass-panel {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans antialiased selection:bg-brand-500 selection:text-white">

    <header class="border-b border-slate-800 glass-panel sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="p-2 bg-brand-600/20 text-brand-500 rounded-xl border border-brand-500/30">
                    <i data-lucide="languages" class="w-6 h-6"></i>
                </div>
                <div>
                    <h1 class="font-bold text-lg leading-tight bg-gradient-to-r from-blue-400 via-indigo-300 to-purple-400 bg-clip-text text-transparent">VoiceTranslate Pro</h1>
                    <p class="text-xs text-slate-400">リアルタイム音声認識 & 翻訳</p>
                </div>
            </div>

            <!-- Status Indicator & Settings Badge -->
            <div class="flex items-center gap-3">
                <div id="statusBadge" class="flex items-center gap-2 px-3 py-1.5 rounded-full text-xs font-medium bg-slate-800 text-slate-400 border border-slate-700">
                    <span id="statusDot" class="w-2 h-2 rounded-full bg-slate-500"></span>
                    <span id="statusText">待機中</span>
                </div>
            </div>
        </div>
    </header>

    <main class="flex-1 max-w-6xl w-full mx-auto p-4 md:p-6 grid grid-cols-1 lg:grid-cols-12 gap-6">

        <!-- Left / Top Panel: Translation Control & Realtime Stream -->
        <section class="lg:col-span-7 flex flex-col gap-6">
            
            <!-- Language Selection & Toolbar -->
            <div class="glass-panel rounded-2xl p-4 md:p-5 flex flex-col gap-4 shadow-xl">
                <div class="grid grid-cols-[1fr,auto,1fr] items-center gap-2 md:gap-4">
                    <!-- Source Language Select -->
                    <div class="flex flex-col gap-1.5">
                        <label class="text-xs font-semibold text-slate-400 uppercase tracking-wider flex items-center gap-1.5">
                            <i data-lucide="mic" class="w-3.5 h-3.5 text-brand-500"></i> 話す言語
                        </label>
                        <select id="sourceLangSelect" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2.5 text-sm text-slate-200 focus:outline-none focus:border-brand-500 transition-colors cursor-pointer">
                            <option value="ja-JP" data-code="ja">日本語 (Japan)</option>
                            <option value="en-US" data-code="en">English (US)</option>
                            <option value="zh-CN" data-code="zh-CN">中国語 簡体 (China)</option>
                            <option value="ko-KR" data-code="ko">韓国語 (Korea)</option>
                            <option value="es-ES" data-code="es">Español (Spain)</option>
                            <option value="fr-FR" data-code="fr">Français (France)</option>
                            <option value="de-DE" data-code="de">Deutsch (Germany)</option>
                            <option value="it-IT" data-code="it">Italiano (Italy)</option>
                            <option value="ru-RU" data-code="ru">Русский (Russia)</option>
                            <option value="vi-VN" data-code="vi">Tiếng Việt (Vietnam)</option>
                            <option value="th-TH" data-code="th">ไทย (Thailand)</option>
                        </select>
                    </div>

                    <!-- Swap Button -->
                    <div class="pt-5 flex justify-center">
                        <button id="swapLangBtn" title="言語を入れ替える" class="p-2.5 rounded-full bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-300 hover:text-white transition-all transform hover:rotate-180 duration-300 active:scale-95">
                            <i data-lucide="arrow-left-right" class="w-4 h-4"></i>
                        </button>
                    </div>

                    <!-- Target Language Select -->
                    <div class="flex flex-col gap-1.5">
                        <label class="text-xs font-semibold text-slate-400 uppercase tracking-wider flex items-center gap-1.5">
                            <i data-lucide="volume-2" class="w-3.5 h-3.5 text-purple-400"></i> 翻訳先の言語
                        </label>
                        <select id="targetLangSelect" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2.5 text-sm text-slate-200 focus:outline-none focus:border-purple-500 transition-colors cursor-pointer">
                            <option value="en-US" data-code="en">English (US)</option>
                            <option value="ja-JP" data-code="ja">日本語 (Japan)</option>
                            <option value="zh-CN" data-code="zh-CN">中国語 簡体 (China)</option>
                            <option value="ko-KR" data-code="ko">韓国語 (Korea)</option>
                            <option value="es-ES" data-code="es">Español (Spain)</option>
                            <option value="fr-FR" data-code="fr">Français (France)</option>
                            <option value="de-DE" data-code="de">Deutsch (Germany)</option>
                            <option value="it-IT" data-code="it">Italiano (Italy)</option>
                            <option value="ru-RU" data-code="ru">Русский (Russia)</option>
                            <option value="vi-VN" data-code="vi">Tiếng Việt (Vietnam)</option>
                            <option value="th-TH" data-code="th">ไทย (Thailand)</option>
                        </select>
                    </div>
                </div>

                <!-- Toggle Options -->
                <div class="flex items-center justify-between border-t border-slate-800/80 pt-3 mt-1">
                    <label class="flex items-center gap-2 cursor-pointer select-none text-xs text-slate-300 hover:text-white">
                        <input type="checkbox" id="autoSpeakToggle" checked class="w-4 h-4 rounded bg-slate-900 border-slate-700 text-brand-600 focus:ring-brand-500 focus:ring-offset-slate-900">
                        <span>翻訳後に自動で音声読み上げ</span>
                    </label>

                    <label class="flex items-center gap-2 cursor-pointer select-none text-xs text-slate-300 hover:text-white">
                        <input type="checkbox" id="continuousToggle" checked class="w-4 h-4 rounded bg-slate-900 border-slate-700 text-brand-600 focus:ring-brand-500 focus:ring-offset-slate-900">
                        <span>連続認識モード</span>
                    </label>
                </div>
            </div>

            <div class="glass-panel rounded-2xl p-5 flex flex-col gap-4 flex-1 shadow-xl relative overflow-hidden">
                <!-- Live Original Transcript Box -->
                <div class="flex flex-col gap-2">
                    <div class="flex items-center justify-between">
                        <span class="text-xs font-semibold text-slate-400 flex items-center gap-1.5">
                            <span class="w-2 h-2 rounded-full bg-brand-500"></span> 音声認識（リアルタイム）
                        </span>
                        <button id="copyOriginalBtn" title="原文をコピー" class="text-slate-400 hover:text-slate-200 text-xs flex items-center gap-1 transition-colors">
                            <i data-lucide="copy" class="w-3.5 h-3.5"></i> コピー
                        </button>
                    </div>
                    <div id="liveOriginal" class="min-h-[80px] p-3.5 rounded-xl bg-slate-900/80 border border-slate-800 text-slate-100 text-base leading-relaxed break-words font-medium">
                        <span class="text-slate-500 italic">マイクボタンを押して話し始めてください...</span>
                    </div>
                </div>

                <!-- Live Translation Box -->
                <div class="flex flex-col gap-2 flex-1">
                    <div class="flex items-center justify-between">
                        <span class="text-xs font-semibold text-purple-400 flex items-center gap-1.5">
                            <span class="w-2 h-2 rounded-full bg-purple-500"></span> 翻訳結果
                        </span>
                        <div class="flex items-center gap-2">
                            <button id="speakTranslationBtn" title="翻訳を読み上げる" class="text-purple-400 hover:text-purple-300 text-xs flex items-center gap-1 transition-colors">
                                <i data-lucide="volume-2" class="w-3.5 h-3.5"></i> 再生
                            </button>
                            <button id="copyTranslationBtn" title="翻訳をコピー" class="text-slate-400 hover:text-slate-200 text-xs flex items-center gap-1 transition-colors">
                                <i data-lucide="copy" class="w-3.5 h-3.5"></i> コピー
                            </button>
                        </div>
                    </div>
                    <div id="liveTranslated" class="min-h-[100px] flex-1 p-3.5 rounded-xl bg-purple-950/20 border border-purple-900/40 text-purple-100 text-lg font-medium leading-relaxed break-words">
                        <span class="text-slate-500 italic">ここに翻訳テキストが表示されます</span>
                    </div>
                </div>

                <!-- Waveform Animation Overlay (Visible during listening) -->
                <div id="waveContainer" class="hidden flex items-center justify-center gap-1.5 py-2">
                    <span class="w-1 bg-brand-500 rounded-full animate-wave" style="animation-delay: 0.0s"></span>
                    <span class="w-1 bg-brand-400 rounded-full animate-wave" style="animation-delay: 0.2s"></span>
                    <span class="w-1 bg-purple-500 rounded-full animate-wave" style="animation-delay: 0.4s"></span>
                    <span class="w-1 bg-purple-400 rounded-full animate-wave" style="animation-delay: 0.1s"></span>
                    <span class="w-1 bg-brand-500 rounded-full animate-wave" style="animation-delay: 0.3s"></span>
                </div>

                <!-- Microphone Control Bar -->
                <div class="pt-2 flex items-center justify-center gap-4">
                    <button id="micToggleBtn" class="group relative px-6 py-3.5 rounded-full bg-brand-600 hover:bg-brand-500 text-white font-semibold shadow-lg shadow-brand-600/30 flex items-center gap-3 transition-all duration-300 active:scale-95">
                        <i id="micIcon" data-lucide="mic" class="w-5 h-5"></i>
                        <span id="micBtnText">音声認識を開始</span>
                    </button>
                    
                    <button id="clearCurrentBtn" title="表示をクリア" class="p-3.5 rounded-full bg-slate-800 hover:bg-slate-700 text-slate-400 hover:text-slate-200 border border-slate-700 transition-colors">
                        <i data-lucide="rotate-ccw" class="w-5 h-5"></i>
                    </button>
                </div>
            </div>
        </section>

        <section class="lg:col-span-5 flex flex-col gap-4">
            <div class="glass-panel rounded-2xl p-5 flex flex-col h-[520px] shadow-xl">
                <div class="flex items-center justify-between pb-3 border-b border-slate-800">
                    <div class="flex items-center gap-2">
                        <i data-lucide="history" class="w-4 h-4 text-slate-400"></i>
                        <h2 class="font-bold text-slate-200 text-sm">翻訳履歴</h2>
                    </div>
                    <button id="clearHistoryBtn" class="text-xs text-slate-500 hover:text-rose-400 transition-colors flex items-center gap-1">
                        <i data-lucide="trash-2" class="w-3.5 h-3.5"></i> 履歴消去
                    </button>
                </div>

                <!-- History Items List Container -->
                <div id="historyList" class="flex-1 overflow-y-auto py-3 space-y-3 pr-1">
                    <div id="emptyHistory" class="h-full flex flex-col items-center justify-center text-slate-500 text-xs gap-2">
                        <i data-lucide="message-square-dashed" class="w-8 h-8 stroke-1"></i>
                        <span>会話の履歴がここに保存されます</span>
                    </div>
                </div>
            </div>
        </section>

    </main>

    <div id="toast" class="fixed bottom-6 right-6 z-50 bg-slate-800 text-slate-100 border border-slate-700 px-4 py-2.5 rounded-xl shadow-2xl flex items-center gap-2 text-xs font-medium translate-y-16 opacity-0 transition-all duration-300 pointer-events-none">
        <i id="toastIcon" data-lucide="check-circle" class="w-4 h-4 text-emerald-400"></i>
        <span id="toastMsg">通知メッセージ</span>
    </div>

    <script>
        // DOM Elements Initializer
        const sourceLangSelect = document.getElementById('sourceLangSelect');
        const targetLangSelect = document.getElementById('targetLangSelect');
        const swapLangBtn = document.getElementById('swapLangBtn');
        const autoSpeakToggle = document.getElementById('autoSpeakToggle');
        const continuousToggle = document.getElementById('continuousToggle');

        const liveOriginal = document.getElementById('liveOriginal');
        const liveTranslated = document.getElementById('liveTranslated');
        const waveContainer = document.getElementById('waveContainer');

        const micToggleBtn = document.getElementById('micToggleBtn');
        const micIcon = document.getElementById('micIcon');
        const micBtnText = document.getElementById('micBtnText');
        const clearCurrentBtn = document.getElementById('clearCurrentBtn');

        const speakTranslationBtn = document.getElementById('speakTranslationBtn');
        const copyOriginalBtn = document.getElementById('copyOriginalBtn');
        const copyTranslationBtn = document.getElementById('copyTranslationBtn');

        const historyList = document.getElementById('historyList');
        const emptyHistory = document.getElementById('emptyHistory');
        const clearHistoryBtn = document.getElementById('clearHistoryBtn');

        const statusBadge = document.getElementById('statusBadge');
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');

        // Application State
        let isListening = false;
        let recognition = null;
        let finalTranscript = '';
        let currentTranslatedText = '';
        let translationDebounceTimer = null;
        let history = [];

        window.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
            initSpeechRecognition();
            loadHistory();
        });

        // Initialize SpeechRecognition
        function initSpeechRecognition() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

            if (!SpeechRecognition) {
                showToast('お使いのブラウザは音声認識機能に対応していません。(Chrome/Edge推奨)', 'error');
                micToggleBtn.disabled = true;
                micToggleBtn.classList.add('opacity-50', 'cursor-not-allowed');
                updateStatus('unsupported', '非対応ブラウザ');
                return;
            }

            recognition = new SpeechRecognition();
            recognition.continuous = continuousToggle.checked;
            recognition.interimResults = true;
            recognition.lang = sourceLangSelect.value;

            // Speech Recognition Event Listeners
            recognition.onstart = () => {
                isListening = true;
                updateStatus('listening', '音声認識中...');
                micBtnText.textContent = '認識を停止';
                micToggleBtn.classList.remove('bg-brand-600', 'hover:bg-brand-500');
                micToggleBtn.classList.add('bg-rose-600', 'hover:bg-rose-500', 'shadow-rose-600/30');
                waveContainer.classList.remove('hidden');
            };

            recognition.onresult = (event) => {
                let interimTranscript = '';

                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    if (event.results[i].isFinal) {
                        finalTranscript += event.results[i][0].transcript;
                    } else {
                        interimTranscript += event.results[i][0].transcript;
                    }
                }

                const currentFullText = finalTranscript + interimTranscript;
                
                if (currentFullText.trim()) {
                    liveOriginal.textContent = currentFullText;
                    
                    // Trigger real-time debounced translation
                    clearTimeout(translationDebounceTimer);
                    translationDebounceTimer = setTimeout(() => {
                        handleTranslation(currentFullText, event.results[event.results.length - 1]?.isFinal);
                    }, 400);
                }
            };

            recognition.onerror = (event) => {
                console.error('Speech recognition error:', event.error);
                if (event.error !== 'no-speech') {
                    showToast(`音声認識エラー: ${event.error}`, 'error');
                }
            };

            recognition.onend = () => {
                // Restart automatically if continuous mode enabled & user didn't manually stop
                if (isListening && continuousToggle.checked) {
                    try {
                        recognition.start();
                    } catch (e) {
                        stopListening();
                    }
                } else {
                    stopListening();
                }
            };
        }

        // Toggle Microphone State
        micToggleBtn.addEventListener('click', () => {
            if (!recognition) return;

            if (isListening) {
                isListening = false;
                recognition.stop();
            } else {
                finalTranscript = '';
                liveOriginal.textContent = '';
                liveTranslated.textContent = '';
                recognition.lang = sourceLangSelect.value;
                recognition.continuous = continuousToggle.checked;
                
                try {
                    recognition.start();
                } catch (err) {
                    console.error('Failed to start recognition:', err);
                }
            }
        });

        function stopListening() {
            isListening = false;
            updateStatus('idle', '待機中');
            micBtnText.textContent = '音声認識を開始';
            micToggleBtn.classList.remove('bg-rose-600', 'hover:bg-rose-500', 'shadow-rose-600/30');
            micToggleBtn.classList.add('bg-brand-600', 'hover:bg-brand-500');
            waveContainer.classList.add('hidden');
        }

        async function handleTranslation(text, isFinal = false) {
            if (!text || !text.trim()) return;

            const sourceCode = sourceLangSelect.options[sourceLangSelect.selectedIndex].getAttribute('data-code');
            const targetCode = targetLangSelect.options[targetLangSelect.selectedIndex].getAttribute('data-code');

            if (sourceCode === targetCode) {
                currentTranslatedText = text;
                liveTranslated.textContent = text;
                if (isFinal) addToHistory(text, text);
                return;
            }

            try {
                // Free endpoint for translation
                const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=${sourceCode}&tl=${targetCode}&dt=t&q=${encodeURIComponent(text)}`;
                const response = await fetch(url);
                const data = await response.json();

                if (data && data[0]) {
                    const translatedParts = data[0].map(part => part[0]).filter(Boolean);
                    const translatedText = translatedParts.join('');

                    currentTranslatedText = translatedText;
                    liveTranslated.textContent = translatedText;

                    // If final sentence chunk, save to history and auto speak if option checked
                    if (isFinal && translatedText.trim()) {
                        addToHistory(text, translatedText);
                        if (autoSpeakToggle.checked) {
                            speakText(translatedText, targetLangSelect.value);
                        }
                    }
                }
            } catch (error) {
                console.error('Translation error:', error);
                liveTranslated.textContent = '（翻訳処理中にエラーが発生しました）';
            }
        }

        function speakText(text, lang) {
            if (!('speechSynthesis' in window)) {
                showToast('お使いのブラウザは音声読み上げに対応していません', 'error');
                return;
            }

            window.speechSynthesis.cancel(); // Stop active speech

            if (!text || !text.trim()) return;

            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = lang;
            
            // Try matching available voice for optimal quality
            const voices = window.speechSynthesis.getVoices();
            const matchingVoice = voices.find(v => v.lang.startsWith(lang.slice(0, 2)));
            if (matchingVoice) utterance.voice = matchingVoice;

            utterance.onstart = () => updateStatus('speaking', '読み上げ中...');
            utterance.onend = () => updateStatus(isListening ? 'listening' : 'idle', isListening ? '音声認識中...' : '待機中');
            utterance.onerror = () => updateStatus('idle', '待機中');

            window.speechSynthesis.speak(utterance);
        }

        speakTranslationBtn.addEventListener('click', () => {
            if (currentTranslatedText) {
                speakText(currentTranslatedText, targetLangSelect.value);
            }
        });

        swapLangBtn.addEventListener('click', () => {
            const tempVal = sourceLangSelect.value;
            sourceLangSelect.value = targetLangSelect.value;
            targetLangSelect.value = tempVal;

            if (isListening && recognition) {
                recognition.stop();
                showToast('言語を変更したため認識を再起動します', 'info');
            }
            showToast('言語を入れ替えました', 'success');
        });

        sourceLangSelect.addEventListener('change', () => {
            if (isListening && recognition) {
                recognition.stop();
            }
        });

        clearCurrentBtn.addEventListener('click', () => {
            finalTranscript = '';
            currentTranslatedText = '';
            liveOriginal.innerHTML = '<span class="text-slate-500 italic">マイクボタンを押して話し始めてください...</span>';
            liveTranslated.innerHTML = '<span class="text-slate-500 italic">ここに翻訳テキストが表示されます</span>';
            showToast('画面表示をクリアしました', 'info');
        });

        // Copy functionality
        copyOriginalBtn.addEventListener('click', () => {
            const text = liveOriginal.textContent;
            if (text && !text.includes('話し始めてください')) {
                copyToClipboard(text);
            }
        });

        copyTranslationBtn.addEventListener('click', () => {
            if (currentTranslatedText) {
                copyToClipboard(currentTranslatedText);
            }
        });

        function copyToClipboard(text) {
            const textInput = document.createElement('textarea');
            textInput.value = text;
            document.body.appendChild(textInput);
            textInput.select();
            document.execCommand('copy');
            document.body.removeChild(textInput);
            showToast('クリップボードにコピーしました', 'success');
        }

        function addToHistory(original, translated) {
            if (!original.trim() || !translated.trim()) return;

            const item = {
                id: Date.now(),
                original,
                translated,
                sourceLang: sourceLangSelect.value,
                targetLang: targetLangSelect.value,
                timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
            };

            history.unshift(item);
            if (history.length > 50) history.pop(); // Max 50 items
            
            saveHistory();
            renderHistory();
        }

        function renderHistory() {
            if (history.length === 0) {
                emptyHistory.classList.remove('hidden');
                historyList.querySelectorAll('.history-card').forEach(el => el.remove());
                return;
            }

            emptyHistory.classList.add('hidden');
            
            // Re-render items
            const existingCards = historyList.querySelectorAll('.history-card');
            existingCards.forEach(card => card.remove());

            history.forEach(item => {
                const card = document.createElement('div');
                card.className = 'history-card p-3 rounded-xl bg-slate-900/60 border border-slate-800 flex flex-col gap-1.5 hover:border-slate-700 transition-colors group';
                card.innerHTML = `
                    <div class="flex items-center justify-between text-[10px] text-slate-500">
                        <span>${item.timestamp} (${item.sourceLang.slice(0,2).toUpperCase()} → ${item.targetLang.slice(0,2).toUpperCase()})</span>
                        <button class="speak-history-btn p-1 text-slate-400 hover:text-purple-400 transition-colors" title="読み上げ">
                            <i data-lucide="volume-2" class="w-3.5 h-3.5"></i>
                        </button>
                    </div>
                    <p class="text-xs text-slate-300 font-medium">${escapeHtml(item.original)}</p>
                    <p class="text-xs text-purple-300 font-semibold bg-purple-950/30 p-2 rounded-lg border border-purple-900/30">${escapeHtml(item.translated)}</p>
                `;

                card.querySelector('.speak-history-btn').addEventListener('click', () => {
                    speakText(item.translated, item.targetLang);
                });

                historyList.appendChild(card);
            });

            lucide.createIcons();
        }

        clearHistoryBtn.addEventListener('click', () => {
            if (history.length === 0) return;
            history = [];
            saveHistory();
            renderHistory();
            showToast('履歴を消去しました', 'info');
        });

        function saveHistory() {
            try {
                localStorage.setItem('vt_history', JSON.stringify(history));
            } catch (e) {
                console.error('LocalStorage error:', e);
            }
        }

        function loadHistory() {
            try {
                const saved = localStorage.getItem('vt_history');
                if (saved) {
                    history = JSON.parse(saved);
                    renderHistory();
                }
            } catch (e) {
                console.error('Failed to load history:', e);
            }
        }

        function updateStatus(type, label) {
            statusText.textContent = label;
            statusDot.className = 'w-2 h-2 rounded-full ';

            if (type === 'listening') {
                statusDot.classList.add('bg-emerald-500', 'animate-pulse');
                statusBadge.className = 'flex items-center gap-2 px-3 py-1.5 rounded-full text-xs font-medium bg-emerald-950/40 text-emerald-400 border border-emerald-800/50';
            } else if (type === 'speaking') {
                statusDot.classList.add('bg-purple-500', 'animate-pulse');
                statusBadge.className = 'flex items-center gap-2 px-3 py-1.5 rounded-full text-xs font-medium bg-purple-950/40 text-purple-400 border border-purple-800/50';
            } else if (type === 'unsupported') {
                statusDot.classList.add('bg-rose-500');
                statusBadge.className = 'flex items-center gap-2 px-3 py-1.5 rounded-full text-xs font-medium bg-rose-950/40 text-rose-400 border border-rose-800/50';
            } else {
                statusDot.classList.add('bg-slate-500');
                statusBadge.className = 'flex items-center gap-2 px-3 py-1.5 rounded-full text-xs font-medium bg-slate-800 text-slate-400 border border-slate-700';
            }
        }

        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toastMsg');
            const toastIcon = document.getElementById('toastIcon');

            toastMsg.textContent = message;

            if (type === 'error') {
                toastIcon.setAttribute('data-lucide', 'alert-circle');
                toastIcon.className = 'w-4 h-4 text-rose-400';
            } else if (type === 'info') {
                toastIcon.setAttribute('data-lucide', 'info');
                toastIcon.className = 'w-4 h-4 text-sky-400';
            } else {
                toastIcon.setAttribute('data-lucide', 'check-circle');
                toastIcon.className = 'w-4 h-4 text-emerald-400';
            }

            lucide.createIcons();

            toast.classList.remove('translate-y-16', 'opacity-0');
            toast.classList.add('translate-y-0', 'opacity-100');

            setTimeout(() => {
                toast.classList.remove('translate-y-0', 'opacity-100');
                toast.classList.add('translate-y-16', 'opacity-0');
            }, 3000);
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
